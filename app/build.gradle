apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'com.mobai.jm'
    compileSdk 35
    buildToolsVersion "34.0.0"

    def jinmanjiKeystore = System.getenv("JINMANJI_KEYSTORE") ?: (project.findProperty("jinmanji.keystore")?.toString())
    def jinmanjiStorePass = System.getenv("JINMANJI_STORE_PASSWORD") ?: (project.findProperty("jinmanji.storePassword")?.toString())
    def jinmanjiAlias = System.getenv("JINMANJI_KEY_ALIAS") ?: (project.findProperty("jinmanji.keyAlias")?.toString())
    def jinmanjiKeyPass = System.getenv("JINMANJI_KEY_PASSWORD") ?: (project.findProperty("jinmanji.keyPassword")?.toString()) ?: jinmanjiStorePass
    def hasFixedSigning = jinmanjiKeystore != null && file(jinmanjiKeystore).exists()

    signingConfigs {
        if (hasFixedSigning) {
            fixed {
                storeFile file(jinmanjiKeystore)
                storePassword jinmanjiStorePass
                keyAlias jinmanjiAlias
                keyPassword jinmanjiKeyPass
            }
        }
    }

    defaultConfig {
        applicationId "com.jinmanji.app"
        minSdk 26
        targetSdk 35
        versionCode 53
        versionName "0.13.2"
    }

    buildTypes {
        debug {
            if (hasFixedSigning) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            if (hasFixedSigning) signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
