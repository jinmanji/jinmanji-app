name: Release

# 触发方式（推送代码/标签不会自动构建）：
#  ① 在 GitHub 上发布 Release 时
#  ② 在 Actions 页面手动 Run workflow
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - name: Prepare signing keystore (repo secrets)
        env:
          KS_B64: ${{ secrets.JINMANJI_KEYSTORE_BASE64 }}
          KS_STORE_PASSWORD: ${{ secrets.JINMANJI_STORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.JINMANJI_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.JINMANJI_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/jinmanji-release.jks"
            {
              echo "JINMANJI_KEYSTORE=$RUNNER_TEMP/jinmanji-release.jks"
              echo "JINMANJI_STORE_PASSWORD=$KS_STORE_PASSWORD"
              echo "JINMANJI_KEY_ALIAS=$KS_KEY_ALIAS"
              echo "JINMANJI_KEY_PASSWORD=$KS_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "✅ 固定签名密钥已装载（与本地构建同一密钥）"
          else
            echo "::warning::未配置 JINMANJI_KEYSTORE_BASE64，本次将使用临时调试签名（与其他构建互不兼容！）"
          fi

      - name: Resolve tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Collect artifacts
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/jinmanji-${TAG}.apk"
          cp plugin-tor/build/outputs/apk/debug/plugin-tor-debug.apk "dist/jinmanji-tunnel-tor-plugin-${TAG}.apk"
          ls -la dist/

      - name: Print signing certificate (SHA-256)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1 || true)
          if [ -n "$APKSIGNER" ]; then
            for f in dist/*.apk; do
              echo "== $f"
              "$APKSIGNER" verify --print-certs "$f" 2>/dev/null | grep -E "SHA-256" | head -1 || true
            done
          fi

      - name: Update release notes & upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: python3 .github/scripts/release_notes.py "$TAG"
